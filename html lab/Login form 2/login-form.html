<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login Form Font Awesome</title>
    <link rel="stylesheet" href="login-form.css">
</head>
<body>
    <div class="image-container">
        <img src="images/image-photo.jpg" alt="Profile photo">
    </div>
    <main>
        <h1>Flat Business Profile Widget</h1>
        <form action="#" method="post">
            <div class="input-field">
                <i class="fa fa-user" aria-hidden="true"></i>
                <input type="text" name="username" placeholder="Name" aria-label="Username" autocomplete="username">
            </div>
            <div class="input-field">
                <i class="fa fa-unlock-alt" aria-hidden="true"></i>
                <input type="password" name="password" placeholder="*******" aria-label="Password" autocomplete="current-password">
            </div>
            <input type="submit" value="Submit">
        </form>
    </main>
    <footer>
        <p>&copy; 2016 Flat Business Profile Widget. All rights reserved</p>
    </footer>
</body>
</html>
