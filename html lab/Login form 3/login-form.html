<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form Bg Images</title>
    <link rel="stylesheet" href="login-form.css">
</head>
<body>
    <div class="image-container">
        <img src="images/image-photo.jpg" alt="Profile photo">
    </div>
    <main>
        <h1>Flat Business Profile Widget</h1>
        <form action="#" method="post">
            <input type="text" class="username" name="username" placeholder="Name" aria-label="Username" autocomplete="username" required>
            <input type="password" class="password" name="password" placeholder="Password" aria-label="Password" autocomplete="current-password" required>
            <input type="submit" value="Submit">
        </form>
    </main>
    <footer>
        <p>&copy; 2016 Flat Business Profile Widget. All rights reserved</p>
    </footer>
</body>
</html>
