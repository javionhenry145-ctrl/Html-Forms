<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Form</title>
    <link rel="stylesheet" href="Contact%20Form.css">
</head>
<body>
    <form class="contact-form" action="#" method="post">
        <header>
            <h1>Contact Form</h1>
            <p>Please fill all the texts in the fields.</p>
        </header>

        <div class="field">
            <label for="name">Your Name :</label>
            <input type="text" id="name" name="name" placeholder="Your Full Name" required>
        </div>

        <div class="field">
            <label for="email">Your Email :</label>
            <input type="email" id="email" name="email" placeholder="Valid Email Address" required>
        </div>

        <div class="field">
            <label for="message">Message :</label>
            <textarea id="message" name="message" placeholder="Your Message to Us" required></textarea>
        </div>

        <div class="field">
            <label for="subject">Subject :</label>
            <select id="subject" name="subject">
                <option>Job Inquiry</option>
                <option>General Question</option>
            </select>
        </div>

        <div class="send">
            <input type="submit" value="Send">
        </div>
    </form>
</body>
</html>
